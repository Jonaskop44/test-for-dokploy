services:
  web:
    image: nginx:alpine
    privileged: true
    ports:
      - "8080:80"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/host-etc

volumes:
  dbdata:
